<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWC — оформление рассрочки</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#171F53;--b:#346AF3;--bh:#2A58D0;--soft:#EFF4FF;--sk:#F4F6FB;--gray:#8389A9;--line:#EFF4FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#242424;overflow:hidden}
*{box-sizing:border-box}
#stage{position:relative;width:100%;height:100%}
#frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;margin:-450px 0 0 -720px;background:#fff;border-radius:16px;overflow:hidden;color:var(--ink);font:400 14px/20px Inter,system-ui,sans-serif;transform-origin:center}
.a{position:absolute}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;transition:background-color .2s ease,color .2s ease,opacity .2s ease}
img{display:block}
.btn{background:var(--b);color:#fff;border-radius:8px;font-size:16px;height:56px;line-height:56px;text-align:center}
.btn:hover{background:var(--bh)}
.btn.g{background:var(--soft);color:var(--b)}.btn.g:hover{background:#DFE8FF}
.btn.s{height:46px;line-height:46px;font-size:14px;width:135px}
.btn.w{background:#fff;color:var(--b)}.btn.w:hover{background:#E6EEFF}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn:disabled:hover{background:var(--b)}
.lnk:hover{opacity:.55}
.h1{font-size:28px;line-height:34px;font-weight:400;margin:0}
.chev{display:inline-block;vertical-align:middle;margin-left:11px}
.nav{display:flex;gap:51px;font-size:16px;line-height:24px;color:#111}
.sk{background:var(--sk);border-radius:12px}
.card{width:368px;height:230px;border-radius:16px;background:var(--soft)}
.card.hot{background:var(--b);color:#fff}
.card .n{left:24px;top:25px}.card .d{left:24px;top:56px;font-size:24px;line-height:30px}
.card .t{left:24px;top:122px;color:var(--gray)}.card.hot .t{color:#A9BFFB}
.card .p{left:24px;top:167px;font-size:24px;line-height:30px;display:flex;align-items:center}
.card .p i{width:1px;height:24px;background:currentColor;transform:rotate(15deg);margin:0 9px 0 8px}
.card .p span{font-size:14px;line-height:20px}
.card .btn{right:24px;top:159px}
.side{position:absolute;left:0;top:0;width:536px;height:900px;background:var(--soft)}
.side .st{color:var(--gray);left:144px;display:flex}
.side .st:before{content:"";width:16px;height:1px;background:#B9C0D8;margin:10px 16px 0 0}
.side .st.on{color:var(--b)}.side .st.on:before{background:var(--b)}
.ok{margin-left:18px;color:#3BB54A}
.big{font-size:32px;line-height:40px}.big s{margin:0 8px 0 4px}
.row{left:144px;width:270px;display:flex;justify-content:space-between}
.tbl{left:634px;top:217px;width:563px}
.tbl div{height:53px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.m{font-weight:500}
.sw{display:inline-block;vertical-align:middle;width:36px;height:20px;border-radius:10px;background:#C0D5FD;position:relative;margin-left:9px;transition:background-color .2s}
.sw b{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:left .2s}
.sw.on{background:var(--b)}.sw.on b{left:19px}
.sw u{width:5px;height:5px;border-radius:50%;background:#C0D5FD}
.acc{left:634px;top:271px;width:466px;height:72px;border:1px solid #E1E3F2;border-radius:12px}
.acc i{position:absolute;left:23px;top:25px;width:20px;height:20px;border-radius:50%;background:#fff;border:6px solid var(--ink)}
.amt{left:634px;top:444px;display:flex;align-items:center;font-size:36px;line-height:48px}
.amt em{font-style:normal;color:#C3CDDF;margin-right:10px}
.amt input{border:0;outline:0;background:none;font:inherit;color:var(--ink);width:300px;padding:0;caret-color:var(--ink)}
.chip{left:634px;top:532px;height:32px;line-height:32px;padding:0 12px;border-radius:16px;background:var(--soft);color:var(--b);font-size:16px;font-weight:500}
.chip:hover{background:#DFE8FF}
.chk{left:639px;top:696px;display:flex;align-items:center;gap:16px;cursor:pointer}
.chk input{width:16px;height:16px;margin:0;accent-color:var(--b)}
.chk a{border-bottom:1px solid var(--ink);transition:opacity .2s}.chk a:hover{opacity:.55}
</style></head><body><div id="stage"><div id="frame"></div></div>

  ${PLANS.map((x,i)=>`<div class="a card ${x.hot?'hot':''}" style="left:${144+392*i}px;top:330px"><div class="a n">${x.n}</div><div class="a d">${fmt(x.u)} долей</div><div class="a t">Общая сумма $${fmt(x.t)}</div><div class="a p">$${x.m}<i></i><span>в месяц</span></div><button class="a btn s ${x.hot?'w':''}" data-a="pick" data-i="${i}">Инвестировать</button></div>`).join('')}
  <div class="a sk" style="left:144px;top:632px;width:354px;height:28px;border-radius:14px"></div>
  ${[0,1,2,3].map(i=>`<div class="a sk" style="left:${144+294*i}px;top:692px;width:270px;height:144px;border-radius:16px"></div>`).join('')}`;
 }else if(S.step===2){
  h=`${side()}<h2 class="a h1" style="left:634px;top:140px">Основные условия</h2>
  <div class="a tbl"><div><span>Тип инвестиции</span><span class="m">Рассрочка на 9 месяцев</span></div><div><span>Вы получаете</span><span class="m">${fmt(p.u)} долей</span></div><div><span>Общая сумма инвестиции</span><span class="m">$ ${fmt(p.t)}</span></div><div><span>Ежемесячный платёж</span><span class="m">$ ${p.m}</span></div></div>
  <h2 class="a h1" style="left:634px;top:482px">Бонусные условия</h2>
  <div class="a m" style="left:634px;top:561px;width:563px;display:flex;justify-content:space-between;${S.second?'color:var(--b)':''}"><span>Второй платёж<button data-a="second" aria-label="Второй платёж">${sw(S.second,S.second?'':'<u></u>')}</button></span><span>+250 долей</span></div>
  <div class="a" style="left:634px;top:598px;width:545px;line-height:21px">Если вы внесете единовременно платеж за первые два месяца рассрочки, то после полной выплаты дополнительно получите 250 долей.</div>
  <button class="a btn" data-a="next" style="left:634px;top:764px;width:145px">Продолжить</button>`;
 }else if(S.step===3){
  h=`${side()}<h2 class="a h1" style="left:634px;top:140px">Оплата</h2>
  <div class="a m" style="left:634px;top:227px">Счёт списания</div>
  <div class="a acc"><i></i><span class="a m" style="left:55px;top:25px">Основной</span><span class="a m" style="right:24px;top:25px">$ ${fmt(MAIN)}</span></div>
  <div class="a" style="left:634px;top:392px">У вас $${fmt(BONUS)} на бонусном счете, списать?<button data-a="ub" aria-label="Списать бонусы" style="margin-left:8px">${sw(S.useBonus,S.useBonus?CK:XX)}</button></div>
  ${S.useBonus?`<div class="a amt"><em>$</em><input id="bi" inputmode="numeric" placeholder="0" value="${S.bonus||''}"></div><button class="a chip" data-a="all">списать всю сумму</button>`:''}
  <label class="a chk"><input type="checkbox" id="ag" ${S.agree?'checked':''}><span>Нажимая кнопку «Оплатить», я принимаю <a href="#" onclick="return false">правила инвестирования в рассрочку</a>.</span></label>
  <button class="a btn g" data-a="prev" style="left:634px;top:764px;width:183px">Предыдущий шаг</button>
  <button class="a btn" id="payb" data-a="pay" style="left:841px;top:764px;width:120px" ${S.agree?'':'disabled'}>Оплатить</button>`;
 }else{
  const u=p.u+(S.second?250:0);
  h=`${logo}<img class="a" src="${PLANT}" width="186" height="186" style="left:627px;top:144px" alt="">
  <h2 class="a h1" style="left:0;width:1440px;top:343px;text-align:center;font-size:32px;line-height:40px">Оформлено!</h2>
  <div class="a" style="left:0;width:1440px;top:396px;text-align:center">Вы успешно оформили рассрочку.</div>
  <div class="a" style="left:536px;top:465px;width:368px;height:106px;border-radius:12px;background:var(--soft);padding:0 16px"><div style="height:53px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E3EBFC"><span>Вы получите</span><span class="m">${fmt(u)} долей</span></div><div style="height:53px;display:flex;justify-content:space-between;align-items:center"><span>Ежемесячный платёж</span><span class="m">$ ${p.m}</span></div></div>
  <button class="a btn" disabled style="left:637px;top:620px;width:166px;opacity:1;cursor:default">Мои рассрочки</button>
  <button class="a lnk" data-a="home" style="left:0;width:1440px;top:716px;font-size:16px;line-height:24px;color:var(--b);text-align:center">На главную</button>`;
 }
 document.getElementById('frame').innerHTML=h;
 const bi=document.getElementById('bi');
 if(bi){bi.oninput=e=>{let v=Math.min(parseInt(e.target.value.replace(/\D/g,''))||0,maxBonus());S.bonus=v;e.target.value=v||'';document.querySelector('.side').outerHTML=side()};bi.focus();bi.setSelectionRange(99,99)}
 const ag=document.getElementById('ag');
 if(ag)ag.onchange=e=>{S.agree=e.target.checked;document.getElementById('payb').disabled=!S.agree};
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='pick'){S.plan=PLANS[+b.dataset.i];go(2)}
 else if(a==='home')reset();
 else if(a==='second'){S.second=!S.second;S.bonus=Math.min(S.bonus,maxBonus());render()}
 else if(a==='next')go(3);else if(a==='prev')go(2);
 else if(a==='ub'){S.useBonus=!S.useBonus;if(!S.useBonus)S.bonus=0;render()}
 else if(a==='all'){S.bonus=maxBonus();render()}
 else if(a==='pay'&&S.agree)go(4);
});
function fit(){const st=document.getElementById('stage');document.getElementById('frame').style.transform=`scale(${Math.min(1,st.clientWidth/1440,st.clientHeight/900)})`}
addEventListener('resize',fit);fit();reset();
</script></body></html>
